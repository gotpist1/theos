<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Köksspelet – plugga redskapen</title>
<style>
:root{
  --blue:#005293;--blue-d:#003b6b;--blue-l:#e3effa;--yellow:#fecb00;--yellow-d:#c79c00;
  --ink:#14213d;--muted:#4a5878;--bg:#f3f6fb;--card:#ffffff;--line:#d5deec;
  --ok:#156b2f;--ok-bg:#d9f2e0;--bad:#b3261e;--bad-bg:#fde3e1;
  --r:16px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--yellow-d);outline-offset:2px}
header{background:var(--blue);color:#fff;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.hud{max-width:900px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:12px}
.hud h1{font-size:1.05rem;margin:0;white-space:nowrap}
.hud .lvl{flex:1;min-width:0}
.hud .lvl small{display:block;font-size:.8rem;opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:10px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--yellow);border-radius:99px;transition:width .5s}
.iconbtn{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:12px;min-width:44px;min-height:44px;font-size:1.2rem}
.iconbtn:hover{background:rgba(255,255,255,.28)}
main{max-width:900px;margin:0 auto;padding:18px 14px 60px}
h2{margin:.2em 0 .5em;font-size:1.5rem}
h3{margin:.2em 0 .4em}
.sub{color:var(--muted);margin:0 0 1em}
.hint{color:var(--muted);font-size:.92rem}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px}
.center{text-align:center}
.grid{display:grid;gap:14px}
.menu{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.tile{display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px;width:100%;transition:transform .12s,border-color .12s}
.tile:hover{transform:translateY(-2px);border-color:var(--blue)}
.tile.star{border-color:var(--yellow-d);background:#fff9e0}
.tile .em{font-size:2rem;display:block}
.tile b{display:block;font-size:1.15rem;margin:.2em 0}
.tile span.d{color:var(--muted);font-size:.95rem}
.btn{background:var(--blue);color:#fff;border:0;border-radius:12px;padding:12px 20px;min-height:48px;font-weight:700}
.btn:hover{background:var(--blue-d)}
.btn.alt{background:var(--yellow);color:#14213d}
.btn.alt:hover{background:#ffd93d}
.btn.ghost{background:transparent;color:var(--blue);border:2px solid var(--blue)}
.btn.small{min-height:40px;padding:8px 14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
.chip{background:var(--card);border:2px solid var(--line);border-radius:99px;padding:8px 14px;min-height:44px}
.chip[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
.stat{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:12px;font-weight:700}
.stat .grow{flex:1}
.tag{display:inline-block;background:var(--blue-l);color:var(--blue-d);border-radius:99px;padding:2px 12px;font-size:.85rem;font-weight:700;margin-bottom:8px}
.q{font-size:1.2rem;font-weight:600}
.q.big{font-size:2rem;text-align:center;padding:10px 0;font-weight:800}

.pic{background:#fff;border:2px solid var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;height:220px;padding:8px;margin:6px auto}
.pic img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.pic.sm{height:120px;width:100%;margin:0}
.pic.xs{height:56px;width:56px;padding:3px;border-radius:10px;margin:0}

.opts{display:grid;gap:10px;margin-top:14px}
.opts.pics{grid-template-columns:1fr 1fr}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;min-height:56px;width:100%}
.opt:hover:not(:disabled){border-color:var(--blue);background:var(--blue-l)}
.opt .k{background:var(--blue-l);color:var(--blue-d);border-radius:8px;min-width:30px;height:30px;display:grid;place-items:center;font-weight:800;flex:none}
.opt img{height:110px;max-width:100%;object-fit:contain;flex:1;min-width:0;background:#fff;border-radius:8px}
.opt.right img,.opt.wrong img{mix-blend-mode:multiply}
.opt.right{background:var(--ok-bg);border-color:var(--ok)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;font-weight:600}
.fb.ok{background:var(--ok-bg);color:#0d4a1f}
.fb.bad{background:var(--bad-bg);color:#7a1610}
.fb.near{background:#fff3c4;color:#5c4500}
.fb p{margin:.3em 0 0;font-weight:400}
.miss{background:var(--yellow);color:#14213d}
.extra{background:#f4a9a3;color:#5b0f0a}

.txt{width:100%;border:2px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;font-size:1.3rem;text-align:center;letter-spacing:.02em}
.txt:focus{border-color:var(--blue);outline:none}
.txt.shake{animation:shake .35s}
.pat:empty{display:none}
.pat{font:700 1.6rem/1.2 ui-monospace,Menlo,monospace;text-align:center;letter-spacing:.12em;margin:10px 0;min-height:1.9rem;color:var(--blue-d)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

.ans{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:58px;margin:12px 0}
.slot{width:40px;height:50px;border-bottom:4px solid var(--blue);display:grid;place-items:center;font-size:1.6rem;font-weight:800;background:transparent;border-top:0;border-left:0;border-right:0;border-radius:6px 6px 0 0}
.slot.f{background:var(--blue-l)}
.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.ltr{width:48px;height:56px;border-radius:12px;border:2px solid var(--yellow-d);background:var(--yellow);font-size:1.5rem;font-weight:800}
.ltr:disabled{opacity:.25;cursor:default}

.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mc{min-height:130px;border-radius:14px;border:2px solid var(--blue);background:var(--blue);color:#fff;font-size:2rem;display:grid;place-items:center;padding:6px;text-align:center}
.mc.open{background:#fff;color:var(--ink);border-color:var(--line);font-size:1.05rem;font-weight:800}
.mc.open img{max-width:100%;max-height:110px;object-fit:contain}
.mc.done{background:var(--ok-bg);border-color:var(--ok);color:#0d4a1f}
.mc.pop{animation:pop .25s}
@keyframes pop{50%{transform:scale(1.06)}}
@media(max-width:520px){.mem{grid-template-columns:repeat(3,1fr)}.opts.pics{gap:8px}.opt img{height:90px}}

.study{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.sc{display:flex;flex-direction:column;gap:6px}
.sc .nm{font-size:1.5rem;font-weight:800;color:var(--blue-d);display:flex;gap:8px;align-items:center}
.sc .hide{background:var(--blue-l);border:2px dashed var(--blue);border-radius:12px;min-height:52px;color:var(--blue-d);font-weight:700}
.sc .use{color:var(--muted);font-size:.95rem}

.exrow{display:grid;grid-template-columns:130px 1fr;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.exrow .no{font-weight:800;color:var(--muted);margin-bottom:4px}
.exrow input{text-align:left;border-radius:0;border:0;border-bottom:3px solid var(--ink);background:transparent;padding:8px 4px}
.exrow input:focus{border-bottom-color:var(--blue);background:var(--blue-l)}
.exrow.ok{background:var(--ok-bg)}
.exrow.bad{background:var(--bad-bg)}
.exrow.ok,.exrow.bad{padding:12px;border-radius:12px;margin-bottom:6px;border-bottom:0}
@media(max-width:480px){.exrow{grid-template-columns:96px 1fr}}

.stars{font-size:2.4rem;color:var(--yellow-d);letter-spacing:.1em;margin:6px 0}
.prog{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:4px 0 10px}
.prog>i{display:block;height:100%;background:var(--ok);border-radius:99px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{background:var(--card);border:2px dashed var(--line);border-radius:14px;padding:12px;text-align:center;font-size:.85rem;color:var(--muted);opacity:.6}
.badge.on{opacity:1;border:2px solid var(--yellow-d);background:#fff9e0;color:var(--ink)}
.badge .em{font-size:1.8rem;display:block}
.badge b{display:block;font-size:.95rem}
.dots{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
.dp{position:relative}
.dp .pic{height:70px;width:100%;margin:0;padding:4px}
.dp i{position:absolute;top:4px;right:4px;width:14px;height:14px;border-radius:50%;background:var(--line);border:2px solid #fff}
.dp i.m{background:var(--ok)}
.count{background:var(--yellow);color:var(--ink);border-radius:var(--r);padding:12px 16px;font-weight:800;margin-bottom:16px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:99px;font-weight:700;transition:transform .3s;z-index:30;max-width:92vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:20}
</style>
</head>
<body>
<header>
  <div class="hud">
    <button class="iconbtn" id="back" hidden aria-label="Till menyn">←</button>
    <h1>🍴 Köksspelet</h1>
    <div class="lvl"><small id="lvlname"></small><div class="bar" id="xpbar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><i id="xpfill"></i></div></div>
    <button class="iconbtn" id="snd" aria-label="Ljud">🔊</button>
  </div>
</header>
<main id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>
<canvas id="fx" aria-hidden="true"></canvas>

const $=s=>document.querySelector(s);
const app=$("#app");
function h(tag,props,...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(props||{})){
    if(k==="class")e.className=v;
    else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);
    else if(v===true)e.setAttribute(k,"");
    else if(v!==false&&v!=null)e.setAttribute(k,v);
  }
  for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c))}
  return e;
}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function wsample(items,k,wf){
  const arr=items.slice(),out=[];
  while(out.length<k&&arr.length){
    const ws=arr.map(wf);let r=Math.random()*ws.reduce((a,b)=>a+b,0),i=0;
    for(;i<arr.length-1;i++){r-=ws[i];if(r<=0)break}
    out.push(arr.splice(i,1)[0]);
  }
  return out;
}
const KEY="koksspelet-v1";
const S={xp:0,m:{},badges:[],sound:true,hint:true,exam:{best:0,runs:0}};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY))||{})}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const mOf=id=>S.m[id]||{ok:0,bad:0,wok:0,wbad:0};
const mastered=id=>{const m=mOf(id);return m.wok>=2&&m.wok>m.wbad};
const weight=id=>{const m=mOf(id);return Math.min(6,Math.max(.25,1+(m.bad+m.wbad)*1.5-(m.ok+m.wok)*.4))};
function record(id,ok,kind){
  const m=S.m[id]||(S.m[id]={ok:0,bad:0,wok:0,wbad:0});
  if(kind==="write"){ok?m.wok++:m.wbad++}
  else{ok?m.ok++:m.bad++}
  save();
}
const masteredCount=()=>ITEMS.filter(i=>mastered(i.id)).length;

function levelInfo(xp){
  let i=0;for(let k=0;k<LEVELS.length;k++)if(xp>=LEVELS[k][0])i=k;
  const cur=LEVELS[i][0],nxt=LEVELS[i+1]?LEVELS[i+1][0]:null;
  return{i,name:LEVELS[i][1],pct:nxt?Math.round((xp-cur)/(nxt-cur)*100):100,nxt};
}
function hud(){
  const L=levelInfo(S.xp);
  $("#lvlname").textContent=`Nivå ${L.i+1}: ${L.name} · ${S.xp} XP`+(L.nxt?` (nästa vid ${L.nxt})`:"");
  $("#xpfill").style.width=L.pct+"%";
  $("#xpbar").setAttribute("aria-valuenow",L.pct);
  $("#snd").textContent=S.sound?"🔊":"🔇";
  $("#snd").setAttribute("aria-pressed",String(S.sound));
}
function addXp(n){
  if(n<=0)return;
  const before=levelInfo(S.xp).i;
  S.xp+=n;save();hud();
  const L=levelInfo(S.xp);
  if(L.i>before){toast(`🎉 Ny nivå: ${L.name}!`);sfx.win();confetti();if(L.i>=3)unlock("lvl4")}
}
let toastT;
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2800)}
function unlock(id){
  if(S.badges.includes(id))return;
  S.badges.push(id);save();
  const b=BADGES.find(x=>x.id===id);
  setTimeout(()=>{toast(`${b.em} Ny bricka: ${b.n}!`);sfx.win()},400);
}
function played(){unlock("first");if(masteredCount()>=ITEMS.length)unlock("ready")}

/* ljud, tal & konfetti */
let ac;
function tone(f,d,type="sine",t0=0,vol=.15){
  if(!S.sound)return;
  try{
    ac=ac||new(window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+t0;
    o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}
const sfx={ok(){tone(660,.12);tone(880,.18,"sine",.1)},bad(){tone(180,.3,"sawtooth",0,.07)},win(){[523,659,784,1047].forEach((f,i)=>tone(f,.22,"triangle",i*.12))},flip(){tone(440,.05,"square",0,.04)}};
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="sv-SE";speechSynthesis.speak(u)}catch(e){}}
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
function confetti(){
  if(reduce)return;
  const c=$("#fx"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const cols=["#005293","#fecb00","#ffffff","#2e9b4f","#e0457b"];
  const ps=Array.from({length:130},()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,s:5+Math.random()*7,c:cols[Math.floor(Math.random()*cols.length)],r:Math.random()*6}));
  let f=0;
  (function tick(){
    x.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});
    if(++f<130)requestAnimationFrame(tick);else x.clearRect(0,0,c.width,c.height);
  })();
}

const norm=s=>s.trim().toLowerCase().replace(/\s+/g," ");
const strip=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"");
function lev(a,b){
  const D=Array.from({length:a.length+1},(_,i)=>[i,...Array(b.length).fill(0)]);
  for(let j=1;j<=b.length;j++)D[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)
    D[i][j]=Math.min(D[i-1][j]+1,D[i][j-1]+1,D[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return D[a.length][b.length];
}
function judge(input,item){
  const a=norm(input),b=item.n.toLowerCase();
  if(a===b)return{r:"ok"};
  if(strip(a)===strip(b))return{r:"near",msg:"Nästan! Titta noga på å, ä och ö."};
  if(b.length>=5&&lev(a,b)<=1)return{r:"near",msg:"Nästan! Det är en bokstav fel."};
  return{r:"bad"};
}
function matchMask(a,b){
  const n=a.length,m=b.length,D=Array.from({length:n+1},()=>Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)D[i][j]=a[i]===b[j]?D[i+1][j+1]+1:Math.max(D[i+1][j],D[i][j+1]);
  const mask=Array(m).fill(false),maskA=Array(n).fill(false);let i=0,j=0;
  while(i<n&&j<m){if(a[i]===b[j]){mask[j]=true;maskA[i]=true;i++;j++}else if(D[i+1][j]>=D[i][j+1])i++;else j++}
  return [maskA,mask];
}
function diffWord(input,correct){
  const [,mask]=matchMask(norm(input),correct.toLowerCase());
  return h("span",{},[...correct].map((c,k)=>mask[k]?c:h("span",{class:"miss"},c)));
}
function diffTyped(input,correct){
  const a=norm(input),[mask]=matchMask(a,correct.toLowerCase());
  return h("span",{},[...a].map((c,k)=>mask[k]?c:h("span",{class:"extra"},c)));
}
function textInput(extra){
  return h("input",{class:"txt",type:"text",autocapitalize:"none",autocomplete:"off",autocorrect:"off",spellcheck:"false",enterkeyhint:"done",...extra});
}
const picEl=(id,cls="")=>h("div",{class:"pic "+cls},h("img",{src:IMG[id],alt:"Bild på ett köksredskap",draggable:"false"}));

/* ============ VÄLJ RÄTT ============ */
VIEWS.choose=()=>{
  app.append(h("h2",{},"🎯 Välj rätt"),h("p",{class:"sub"},"10 frågor. Ibland ser du en bild och väljer namn, ibland ser du ett namn och väljer bild. Tips: tangenterna 1–4 svarar, Enter går vidare."),
    h("button",{class:"btn alt",onclick:playChoose},"Starta ▶"));
};
function distract(it){
  const same=shuffle(ITEMS.filter(x=>x.g===it.g&&x.id!==it.id)).slice(0,2);
  const rest=shuffle(ITEMS.filter(x=>x.id!==it.id&&!same.includes(x)));
  return same.concat(rest).slice(0,3);
}
function playChoose(){
  const qs=wsample(ITEMS,10,it=>weight(it.id)).map(it=>({it,mode:Math.random()<.5?"pic":"name"}));
  let i=0,score=0,xp=0,locked=false;const missed=[];
  function show(){
    locked=false;const {it,mode}=qs[i];
    const opts=shuffle([it,...distract(it)]);
    const optEls=opts.map((o,k)=>h("button",{class:"opt",onclick:()=>pick(k)},
      h("span",{class:"k"},String(k+1)),
      mode==="name"?h("span",{},o.n):h("img",{src:IMG[o.id],alt:"Bild på ett köksredskap"})));
    const fb=h("div",{"aria-live":"polite"});
    const slot=h("div");
    app.replaceChildren(h("div",{class:"card"},
      h("div",{class:"stat"},h("span",{},`Fråga ${i+1}/${qs.length}`),h("span",{class:"grow"}),h("span",{},`⭐ ${score}`)),
      h("span",{class:"tag"},mode==="name"?"Vad heter redskapet?":"Vilken bild är rätt?"),
      mode==="name"?picEl(it.id):h("div",{class:"q big"},it.n),
      h("div",{class:"opts"+(mode==="pic"?" pics":"")},optEls),fb,slot));
    function pick(k){
      if(locked)return;locked=true;
      const ok=opts[k].id===it.id;
      optEls.forEach((b,j)=>{b.disabled=true;if(opts[j].id===it.id)b.classList.add("right");else if(j===k)b.classList.add("wrong")});
      record(it.id,ok,"quiz");
      if(ok){score++;xp+=5;sfx.ok()}else{missed.push(it);sfx.bad()}
      fb.replaceChildren(h("div",{class:"fb "+(ok?"ok":"bad")},ok?"Rätt!":`Nej, det var: ${it.n}`,h("p",{},it.use)));
      const nb=nextBtn(advance,i+1>=qs.length);slot.append(nb);nb.focus();
    }
    keyHandler=e=>{
      if(/^[1-4]$/.test(e.key)&&!locked)pick(+e.key-1);
      else if(e.key==="Enter"&&locked)advance();
    };
  }
  function advance(){if(++i<qs.length)show();else finish()}
  function finish(){
    played();addXp(xp);
    results({title:score>=9?"Utmärkt! 🎉":score>=6?"Bra jobbat! 👍":"Fortsätt träna 💪",stars:starsFor(score,qs.length),
      lines:[`Du hade ${score} av ${qs.length} rätt och fick ${xp} XP.`,missed.length?`Öva mer på: ${[...new Set(missed.map(m=>m.n))].join(", ")}.`:"Inga fel. Snyggt!"],again:playChoose});
    if(score===qs.length)confetti();
  }
  show();
}

/* ============ BOKSTAVSBYGGET ============ */
VIEWS.build=()=>{
  app.append(h("h2",{},"🔤 Bokstavsbygget"),h("p",{class:"sub"},"Tryck på bokstäverna i rätt ordning (eller skriv på tangentbordet). 6 redskap per omgång."),
    h("button",{class:"btn alt",onclick:playBuild},"Starta ▶"));
};
function playBuild(){
  const qs=wsample(ITEMS,6,it=>weight(it.id));
  let i=0,score=0,xp=0,clean=true;const missed=[];
  function show(){
    const it=qs[i],word=it.n.toLowerCase();
    let order=[...word].map((ch,k)=>({ch,k}));
    for(let t=0;t<20;t++){const s=shuffle(order);if(s.map(x=>x.ch).join("")!==word){order=s;break}}
    const placed=[];let fails=0,hurt=false,done=false;
    const ans=h("div",{class:"ans","aria-live":"polite"});
    const tiles=h("div",{class:"tiles"});
    const fb=h("div");
    const slot=h("div");
    function paint(){
      ans.replaceChildren(...[...word].map((_,k)=>{
        const p=placed[k];
        return h("button",{class:"slot"+(p?" f":""),disabled:!p||done,"aria-label":p?`Ta bort ${p.ch}`:"Tom ruta",onclick:()=>{placed.splice(k,1);paint()}},p?p.ch:"");
      }));
      tiles.replaceChildren(...order.map(o=>h("button",{class:"ltr",disabled:done||placed.includes(o),onclick:()=>add(o)},o.ch)));
    }
    function add(o){
      if(done||placed.includes(o))return;
      placed.push(o);sfx.flip();paint();
      if(placed.length===word.length)check();
    }
    function check(){
      const got=placed.map(p=>p.ch).join("");
      if(got===word){
        done=true;paint();sfx.ok();
        if(!hurt){score++;xp+=10;record(it.id,true,"quiz")}else xp+=4;
        fb.replaceChildren(h("div",{class:"fb ok"},`Rätt! ${it.n}`,h("p",{},it.use)));
        const nb=nextBtn(advance,i+1>=qs.length);slot.append(nb);nb.focus();
      }else{
        fails++;sfx.bad();ans.classList.add("shake");
        if(!hurt){hurt=true;clean=false;missed.push(it);record(it.id,false,"quiz")}
        if(fails>=3){
          done=true;paint();
          fb.replaceChildren(h("div",{class:"fb bad"},"Rätt ord är: ",h("b",{},it.n),h("p",{},it.use)));
          const nb=nextBtn(advance,i+1>=qs.length);slot.append(nb);nb.focus();
        }else setTimeout(()=>{ans.classList.remove("shake");if(!done){placed.length=0;paint()}},600);
      }
    }
    app.replaceChildren(h("div",{class:"card center"},
      h("div",{class:"stat"},h("span",{},`Redskap ${i+1}/${qs.length}`),h("span",{class:"grow"}),h("span",{},`⭐ ${score}`)),
      picEl(it.id),ans,tiles,
      h("div",{class:"row",style:"justify-content:center"},
        h("button",{class:"btn ghost small",onclick:()=>{if(!done){placed.pop();paint()}}},"⌫ Ångra"),
        h("button",{class:"btn ghost small",onclick:()=>{if(!done){placed.length=0;paint()}}},"↺ Börja om")),
      fb,slot));
    paint();
    keyHandler=e=>{
      if(e.key==="Enter"&&done)advance();
      else if(e.key==="Backspace"&&!done){placed.pop();paint()}
      else if(!done&&e.key.length===1){
        const o=order.find(o=>o.ch===e.key.toLowerCase()&&!placed.includes(o));if(o)add(o);
      }
    };
  }
  function advance(){if(++i<qs.length)show();else finish()}
  function finish(){
    played();if(clean)unlock("build");addXp(xp);
    results({title:clean?"Perfekt stavning! 🎉":"Klart!",stars:starsFor(score,qs.length),
      lines:[`${score} av ${qs.length} byggda utan miss. Du fick ${xp} XP.`,missed.length?`Öva mer på: ${[...new Set(missed.map(m=>m.n))].join(", ")}.`:"Inga missar."],again:playBuild});
    if(clean)confetti();
  }
  show();
}

VIEWS.write=()=>{
  const label=()=>`Visa antal bokstäver: ${S.hint?"på":"av"}`;
  const chip=h("button",{class:"chip","aria-pressed":String(S.hint),onclick:()=>{S.hint=!S.hint;save();chip.setAttribute("aria-pressed",String(S.hint));chip.textContent=label()}},label());
  app.append(h("h2",{},"✍️ Skriv namnet"),
    h("p",{class:"sub"},"Skriv vad redskapet heter. 8 redskap per omgång. Med antal bokstäver på visas ett streck för varje bokstav ovanför rutan. Du kan också be om en ledtråd (då får du mindre XP). Skriver du fel får du skriva rätt ord en gång för att öva."),
    h("div",{class:"chips"},chip),
    h("button",{class:"btn alt",onclick:playWrite},"Starta ▶"));
};
function playWrite(){
  const qs=wsample(ITEMS,8,it=>weight(it.id));
  let i=0,score=0,streak=0,best=0,xp=0;const missed=[];
  function show(){
    const it=qs[i];
    let hints=0,retried=false,recorded=false,phase="answer";
    const input=textInput({placeholder:"Skriv namnet här","aria-label":"Namn på redskapet"});
    const pat=h("div",{class:"pat","aria-hidden":"true"});
    const fb=h("div",{"aria-live":"polite"});
    const slot=h("div");
    const paintPat=()=>{pat.textContent=(S.hint||hints>0)?[...it.n].map((c,k)=>k<hints?c:"_").join(" "):""};
    const hintBtn=h("button",{type:"button",class:"btn ghost small",onclick:()=>{if(phase==="answer"&&hints<it.n.length-1){hints++;paintPat();input.focus()}}},"💡 Ledtråd");
    const checkBtn=h("button",{class:"btn",type:"submit"},"Rätta");
    const form=h("form",{onsubmit:e=>{e.preventDefault();submit()}},
      pat,input,
      h("div",{class:"row",style:"justify-content:center;margin-top:14px"},checkBtn,hintBtn));
    app.replaceChildren(h("div",{class:"card center"},
      h("div",{class:"stat"},h("span",{},`Redskap ${i+1}/${qs.length}`),h("span",{class:"grow"}),h("span",{},`🔥 ${streak}`),h("span",{},`⭐ ${score}`)),
      picEl(it.id),fb,form,slot));
    paintPat();input.focus();
    const wob=()=>{input.classList.remove("shake");void input.offsetWidth;input.classList.add("shake")};
    function finishQ(){
      phase="done";input.disabled=true;checkBtn.disabled=true;hintBtn.disabled=true;
      const nb=nextBtn(advance,i+1>=qs.length);slot.append(nb);nb.focus();
    }
    function submit(){
      if(phase==="done"||!input.value.trim())return;
      const j=judge(input.value,it);
      if(phase==="copy"){
        if(j.r==="ok"){sfx.ok();fb.replaceChildren(h("div",{class:"fb ok"},"Bra! Nu har du skrivit det rätt."));finishQ()}
        else{sfx.bad();wob();input.select()}
        return;
      }
      if(j.r==="ok"){
        sfx.ok();
        const clean=hints===0&&!retried;
        if(clean){score++;streak++;best=Math.max(best,streak);xp+=10+(streak>=3?5:0);record(it.id,true,"write");if(streak>=5)unlock("streak")}
        else{xp+=hints?3:4;if(!recorded){record(it.id,true,"quiz")}streak=0}
        fb.replaceChildren(h("div",{class:"fb ok"},clean?"Rätt!":"Rätt, med hjälp!",h("p",{},it.use)));
        finishQ();return;
      }
      if(j.r==="near"&&!retried){
        retried=true;recorded=true;streak=0;record(it.id,false,"write");missed.push(it);
        sfx.bad();wob();
        fb.replaceChildren(h("div",{class:"fb near"},j.msg,h("p",{},"Försök igen. Rätt stavning ger lite XP.")));
        input.select();return;
      }
      sfx.bad();wob();streak=0;
      if(!recorded){recorded=true;record(it.id,false,"write");missed.push(it)}
      phase="copy";
      fb.replaceChildren(h("div",{class:"fb bad"},"Rätt ord: ",diffWord(input.value,it.n),h("p",{},"Du skrev: ",diffTyped(input.value,it.n)),h("p",{},it.use),h("p",{},"Skriv ordet rätt här under för att gå vidare.")));
      input.value="";input.placeholder="Skriv rätt ord en gång";hintBtn.disabled=true;pat.textContent="";input.focus();
    }
  }
  function advance(){if(++i<qs.length)show();else finish()}
  function finish(){
    played();addXp(xp);
    results({title:score>=7?"Utmärkt stavning! 🎉":score>=5?"Bra jobbat! 👍":"Fortsätt träna 💪",stars:starsFor(score,qs.length),
      lines:[`${score} av ${qs.length} rätt utan hjälp. Längsta raden: ${best}. Du fick ${xp} XP.`,missed.length?`Öva mer på: ${[...new Set(missed.map(m=>m.n))].join(", ")}.`:"Inga fel. Snyggt!"],again:playWrite});
    if(score===qs.length)confetti();
  }
  show();
}

/* ============ MEMORY ============ */
VIEWS.memory=()=>{
  app.append(h("h2",{},"🃏 Memory"),h("p",{class:"sub"},"Hitta paren: en bild och dess namn. Klarar du det på högst 9 drag får du en bricka."),
    h("button",{class:"btn alt",onclick:playMemory},"Starta ▶"));
};
function playMemory(){
  const its=wsample(ITEMS,6,it=>weight(it.id));
  const cards=shuffle(its.flatMap(it=>[{it,t:"pic"},{it,t:"name"}]));
  let open=[],moves=0,found=0,lock=false;
  const stat=h("div",{class:"stat"});
  const grid=h("div",{class:"mem"});
  const paintStat=()=>stat.replaceChildren(h("span",{},`Drag: ${moves}`),h("span",{class:"grow"}),h("span",{},`Par: ${found}/${its.length}`));
  const els=cards.map((c,k)=>h("button",{class:"mc","aria-label":"Dolt kort",onclick:()=>flip(k)},"?"));
  function face(k){
    const c=cards[k];els[k].className="mc open";
    els[k].replaceChildren(c.t==="pic"?h("img",{src:IMG[c.it.id],alt:"Bild på ett köksredskap"}):c.it.n);
  }
  function back(k){els[k].className="mc";els[k].replaceChildren("?")}
  function flip(k){
    if(lock||open.includes(k)||els[k].classList.contains("done"))return;
    sfx.flip();face(k);open.push(k);
    if(open.length<2)return;
    moves++;paintStat();
    const [a,b]=open;
    if(cards[a].it.id===cards[b].it.id&&cards[a].t!==cards[b].t){
      [a,b].forEach(x=>{els[x].classList.add("done","pop")});found++;paintStat();open=[];sfx.ok();
      record(cards[a].it.id,true,"quiz");
      if(found===its.length)setTimeout(finish,700);
    }else{
      lock=true;
      setTimeout(()=>{back(a);back(b);open=[];lock=false},1000);
    }
  }
  function finish(){
    const stars=moves<=9?3:moves<=13?2:1,xp=20+stars*5;
    played();if(moves<=9)unlock("memory");addXp(xp);
    results({title:"Alla par hittade! 🎉",stars,lines:[`Du klarade det på ${moves} drag och fick ${xp} XP.`],again:playMemory});
    if(stars===3)confetti();
  }
  paintStat();grid.append(...els);
  app.replaceChildren(h("div",{class:"card"},stat,grid));
}

VIEWS.exam=()=>{
  app.append(h("h2",{},"📝 Provet"),
    h("p",{class:"sub"},"Precis som på förhöret: skriv vad alla 13 redskap heter. Ingen hjälp och inga ledtrådar. Du rättar allt när du är klar."),
    h("button",{class:"btn alt",onclick:playExam},"Starta provet ▶"));
};
function playExam(){
  const list=shuffle(ITEMS);
  const inputs=list.map((it,k)=>textInput({"aria-label":`Namn på redskap ${k+1}`,onkeydown:e=>{
    if(e.key==="Enter"){e.preventDefault();(inputs[k+1]||submitBtn).focus()}
  }}));
  const submitBtn=h("button",{class:"btn alt",onclick:grade},"Lämna in och rätta ▶");
  app.replaceChildren(h("div",{class:"card"},
    h("h2",{},"Redskap del 2"),
    h("p",{class:"hint"},"Enter flyttar till nästa rad."),
    ...list.map((it,k)=>h("div",{class:"exrow"},
      picEl(it.id,"sm"),
      h("div",{},h("div",{class:"no"},`${k+1}.`),inputs[k]))),
    h("div",{style:"margin-top:16px"},submitBtn)));
  inputs[0].focus();
  function grade(){
    let ok=0;
    const rows=list.map((it,k)=>{
      const v=inputs[k].value,j=judge(v,it);
      const good=j.r==="ok";
      if(good){ok++;record(it.id,true,"write")}else record(it.id,false,"write");
      return h("div",{class:"exrow "+(good?"ok":"bad")},
        picEl(it.id,"sm"),
        h("div",{},h("div",{class:"no"},`${k+1}. ${good?"✅ Rätt":"❌ Fel"}`),
          good?h("b",{},it.n)
              :h("div",{},h("div",{},"Du skrev: ",v.trim()?h("b",{},diffTyped(v,it.n)):h("i",{},"(tomt)")),
                h("div",{},"Rätt: ",h("b",{},diffWord(v,it.n))),
                j.r==="near"?h("div",{class:"hint"},j.msg.replace("Nästan! ","")):null)));
    });
    S.exam.runs++;S.exam.best=Math.max(S.exam.best,ok);save();
    const xp=ok*8+(ok===list.length?20:0);
    played();if(ok===list.length)unlock("full");addXp(xp);
    keyHandler=null;
    app.replaceChildren(h("div",{class:"card center"},
      h("h2",{},ok===list.length?"Full pott! 🎉":ok>=list.length*.8?"Mycket bra! 👍":"Fortsätt träna 💪"),
      h("div",{class:"stars","aria-label":`${starsFor(ok,list.length)} av 3 stjärnor`},"★".repeat(starsFor(ok,list.length))+"☆".repeat(3-starsFor(ok,list.length))),
      h("p",{},`${ok} av ${list.length} rätt. Du fick ${xp} XP.`),
      h("div",{class:"row",style:"justify-content:center"},
        h("button",{class:"btn alt",onclick:playExam},"Gör om provet"),
        h("button",{class:"btn ghost",onclick:()=>go("home")},"Till menyn"))),
      h("div",{class:"card",style:"margin-top:14px"},...rows));
    if(ok===list.length)confetti();
    window.scrollTo(0,0);
  }
}

hud();
go("home");
</script>
</body>
</html>
